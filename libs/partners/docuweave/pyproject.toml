[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-docuweave"
version = "0.1.0"
description = "An integration package connecting DocuWeave and LangChain."
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.4.0,<2.0.0",
    "docuweave>=0.2.0",
]

[project.urls]
Source = "https://github.com/langchain-ai/langchain/tree/master/libs/partners/docuweave"
Repository = "https://github.com/langchain-ai/langchain"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_docuweave"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
