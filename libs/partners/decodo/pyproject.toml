[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-decodo"
version = "0.1.0"
description = "LangChain integration for the Decodo web scraping API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Decodo", email = "support@decodo.com" }]
keywords = ["langchain", "web-scraping", "decodo", "llm", "rag", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "langchain-core>=0.1.0,<2.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "langchain-tests>=0.3.0,<2.0.0",
]
lint = ["ruff>=0.4.0,<1.0.0"]
typing = ["mypy>=1.8.0,<2.0.0"]
dev = []
test_integration = []

[project.urls]
Homepage = "https://decodo.com"
Documentation = "https://developers.decodo.com"
Repository = "https://github.com/langchain-ai/langchain/tree/master/libs/partners/decodo"

[tool.hatch.build.targets.wheel]
packages = ["langchain_decodo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
