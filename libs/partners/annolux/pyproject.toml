[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-annolux"
version = "0.1.0"
description = "LangChain integration for Annolux Curated Bilingual Search API with verified snapshot timestamps."
authors = ["Annolux <team@annolux.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://annolux.com"
repository = "https://github.com/eason4kim-rocket/annolux"
keywords = ["langchain", "annolux", "search", "ai-agent", "rag", "bilingual"]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
langchain-core = ">=0.1.0"
requests = ">=2.28.0"
aiohttp = ">=3.8.0"
pydantic = ">=2.0.0"

[tool.poetry.group.test.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.20.0"
responses = ">=0.23.0"
