[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-typesafe"
version = "0.0.1a2"
description = "A LangChain integration for TypeSafe classifiers"
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "httpx2>=2.0.0,<3.0.0",
    "langchain-core>=1.6.2,<2.0.0",
]

[project.optional-dependencies]
experimental = ["langchain>=1.3.15,<2.0.0"]

[project.urls]
Homepage = "https://docs.langchain.com/oss/python/integrations/providers/typesafe"
Documentation = "https://reference.langchain.com/python/integrations/langchain_typesafe/"
Repository = "https://github.com/langchain-ai/langchain"
Issues = "https://github.com/langchain-ai/langchain/issues"
Changelog = "https://github.com/langchain-ai/langchain/releases?q=%22langchain-typesafe%22"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-watcher>=0.6.3,<1.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "langchain-tests>=1.1.9,<2.0.0",
    "langchain>=1.3.15,<2.0.0",
]
test_integration = []
lint = ["ruff>=0.15.0,<0.16.0"]
dev = []
typing = ["mypy>=2.1.0,<2.2.0"]

[tool.uv]
constraint-dependencies = ["pygments>=2.20.0"]  # CVE-2026-4539

[tool.uv.sources]
langchain-core = { path = "../../core", editable = true }
langchain-tests = { path = "../../standard-tests", editable = true }
langchain = { path = "../../langchain_v1", editable = true }

[tool.mypy]
disallow_untyped_defs = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with formatter
    "PLR0913", # Too many arguments
    "ANN401",  # Any is required at LangChain callback seams
    "TC002",   # Runtime imports are useful for Pydantic
    "TC003",   # Runtime imports are useful for Pydantic
]
unfixable = ["B028"] # People should intentionally tune the stacklevel

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Tests need assertions
    "SLF001", # Private member access
    "PLR2004", # Magic values are fine in tests
]
"scripts/*.py" = [
    "INP001", # Not a package
]
